variables:
  MAVEN_CLI_OPTS: " --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn"


stages:
  - test
  - build
  - deploy


unit-test-java17:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS install -Djacoco.skip=false
    - mvn sonar:sonar -Dsonar.projectKey=grus-2024 -Dsonar.projectName=grus-2024
  artifacts:
    expire_in: 7 days
    when: always
    reports:
      junit:
        - grus-boot-autoconfigure/target/surefire-reports/TEST-*.xml
        - grus-boot-autoconfigure/target/failsafe-reports/TEST-*.xml
        - grus-framework/*/target/surefire-reports/TEST-*.xml
        - grus-framework/*/target/failsafe-reports/TEST-*.xml


unit-test-java21:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-21
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS verify -Djava.version=21 -Djacoco.skip=true


maven-deploy:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests -Djacoco.skip=true
    - sh generate_parent_pom.sh
    - mvn $MAVEN_CLI_OPTS -f tmp/.flattened-pom.xml  deploy -DskipTests
  only:
    - 2024.0.x