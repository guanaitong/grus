variables:
  MAVEN_CLI_OPTS: " --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn"


stages:
  - build
  - deploy

#test:
#  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
#  stage: build
#  script:
#    - mvn $MAVEN_CLI_OPTS verify -Djava.version=17  sonar:sonar

mkdocs:
  image: registry.wuxingdev.cn/build/python:3-bullseye
  stage: build
  script:
    - pip3 install mkdocs-material mkdocs-minify-plugin mkdocs-redirects -i https://mirrors.aliyun.com/pypi/simple/
    - mkdocs --version
    - mkdocs build
    - curl -O http://filestorage.wuxingdev.cn/build-cli/build-cli && chmod +x build-cli && ./build-cli -jobName guide-java
  only:
    - master

unit-test:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS test -Djava.version=17 -Djacoco.skip=true

sonar:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar -Djava.version=17 -Djacoco.skip=false


deploy:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests -Djacoco.skip=true
    - sh generate_parent_pom.sh
    - mvn $MAVEN_CLI_OPTS -f tmp/.flattened-pom.xml  deploy -DskipTests
  only:
    - master