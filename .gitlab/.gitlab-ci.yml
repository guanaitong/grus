variables:
  MAVEN_CLI_OPTS: " --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn"


stages:
  - build
  - deploy

test:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS verify -Djava.version=17  sonar:sonar -Dsonar.projectKey=grus-2 -Dsonar.projectName=grus-2

mkdocs:
  image: registry.wuxingdev.cn/third/python:3.10.0
  stage: build
  script:
    - pip3 install mkdocs-material -i https://mirrors.aliyun.com/pypi/simple/
    - mkdocs build
    - curl -O http://filestorage.wuxingdev.cn/build-cli/build-cli && chmod +x build-cli && ./build-cli -jobName guide-java
  only:
    - master
