variables:
  MAVEN_CLI_OPTS: " --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn"


stages:
  - build
  - deploy

#test:
#  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
#  stage: build
#  script:
#    - mvn $MAVEN_CLI_OPTS verify -Djava.version=17  sonar:sonar

pages:
  image: registry.wuxingdev.cn/build/python-mkdocs:3-bullseye
  stage: build
  script:
    - mkdocs --version
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  tags:
    - generics
  only:
    changes:
      - mkdocs.yml
      - docs/**/*

unit-test-java11:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-11
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS package sonar:sonar

unit-test-java17:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-17
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS test -Djava.version=17 -Djacoco.skip=true

deploy:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-11
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests -Djacoco.skip=true
    - sh generate_parent_pom.sh
    - mvn $MAVEN_CLI_OPTS -f tmp/.flattened-pom.xml  deploy -DskipTests
  only:
    - master