variables:
  MAVEN_CLI_OPTS: " --batch-mode -Dorg.slf4j.simpleLogger.defaultLogLevel=warn"


stages:
  - test
  - visualize
  - deploy
  - release


unit-test-java21:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-21
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS install -Djacoco.skip=false
    - mvn sonar:sonar -Dsonar.projectKey=grus-2.0 -Dsonar.projectName=grus-2.0
  artifacts:
    expire_in: 14 days
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
        - "*/target/failsafe-reports/TEST-*.xml"
        - "*/*/target/surefire-reports/TEST-*.xml"
        - "*/*/target/failsafe-reports/TEST-*.xml"
    paths:
      - "grus-boot-autoconfigure/target/site/jacoco-aggregate/jacoco.xml"

visualize-coverage:
  # Must be in a stage later than test-jdk11's stage.
  # The `visualize` stage does not exist by default.
  # Please define it first, or choose an existing stage like `deploy`.
  stage: visualize
  image: registry.wuxingdev.cn/build/jacoco2cobertura:1.0.9
  script:
    - jacoco_paths=`find * -path "**/src/main/java" -type d | sed -e 's@^@'"$CI_PROJECT_DIR"'/@'`
    - python /opt/cover2cover.py grus-boot-autoconfigure/target/site/jacoco-aggregate/jacoco.xml $jacoco_paths > grus-boot-autoconfigure/target/site/jacoco-aggregate/coverage.xml
  needs: [ "unit-test-java21" ]
  dependencies:
    - unit-test-java21
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: grus-boot-autoconfigure/target/site/jacoco-aggregate/coverage.xml
    expire_in: "14 days"



maven-deploy:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-21
  stage: deploy
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests -Djacoco.skip=true
    - sh generate_parent_pom.sh
    - mvn $MAVEN_CLI_OPTS -f tmp/.flattened-pom.xml  deploy -DskipTests
  only:
    refs:
      - branches
    variables:
      - $CI_COMMIT_REF_PROTECTED == "true"

release-job:
  image: registry.wuxingdev.cn/build/maven:3-eclipse-temurin-21
  stage: release
  dependencies:
    - maven-deploy
  script:
    - curl -o /usr/local/bin/release-cli https://filestorage.wuxingdev.cn/gitlab-ci/release-cli-linux-amd64 && chmod +x /usr/local/bin/release-cli
    - export GRUS_VERSION=$(mvn org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=revision -q -DforceStdout)
    - release-cli create --name release-$GRUS_VERSION --tag-name $GRUS_VERSION
  only:
    refs:
      - branches
    variables:
      - $CI_COMMIT_REF_PROTECTED == "true"
  when: manual